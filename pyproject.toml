# TLDR: Package metadata for rl4cv, the environment-measurement and utility-prediction code for RL on Lean code verification.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl4cv"
version = "0.1.0"
description = "Measure RL environments for Lean code verification before RL (rho, H) and predict held-out utility across scale"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]
gen = ["vllm>=0.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
